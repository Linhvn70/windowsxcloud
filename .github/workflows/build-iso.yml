name: Build custom Windows ISO

on:
  workflow_dispatch:
    inputs:
      win:          { description: "Windows (10 hoặc 11)", default: "11" }
      edition:      { description: "Edition cho Fido", default: "Windows 11 Home/Pro/Edu" }
      edition_name: { description: "Tên edition giữ lại trong ISO (đúng chính tả)", default: "Windows 11 Pro" }
      lang:         { description: "Ngôn ngữ", default: "English" }
      iso_url:      { description: "(Tuỳ chọn) link ISO trực tiếp, bỏ qua Fido", default: "" }
      oem_name:     { description: "Tên hãng hiện trong System Properties", default: "MyWindows" }
      user:         { description: "Tên tài khoản (không mật khẩu)", default: "admin" }
      tat_defender: { description: "Tắt Windows Defender để tiết kiệm RAM (true/false)", default: "false" }
      xoa_winre:    { description: "Xoá WinRE để ISO nhẹ hơn ~500MB, mất Reset/Recovery (true/false)", default: "false" }

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Tải ISO
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force C:\work | Out-Null
          $url = "${{ inputs.iso_url }}"
          if (-not $url) {
            Invoke-WebRequest "https://raw.githubusercontent.com/pbatard/Fido/master/Fido.ps1" -OutFile C:\work\Fido.ps1
            $url = & C:\work\Fido.ps1 -Win "${{ inputs.win }}" -Rel Latest -Ed "${{ inputs.edition }}" -Lang "${{ inputs.lang }}" -Arch x64 -GetUrl
          }
          Write-Host "URL: $url"
          Invoke-WebRequest $url -OutFile C:\work\win.iso

      - name: Giải nén ISO
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\work\iso, C:\work\mount | Out-Null
          $img = Mount-DiskImage -ImagePath C:\work\win.iso -PassThru
          $d = ($img | Get-Volume).DriveLetter
          robocopy "${d}:\" C:\work\iso /E /R:1 /W:1 | Out-Null
          Dismount-DiskImage -ImagePath C:\work\win.iso
          Remove-Item C:\work\win.iso -Force
          Get-ChildItem C:\work\iso -Recurse -File | ForEach-Object { $_.IsReadOnly = $false }
          $global:LASTEXITCODE = 0

      - name: Chọn edition và tách thành 1 index
        shell: pwsh
        run: |
          $name = "${{ inputs.edition_name }}"
          $wim = "C:\work\iso\sources\install.wim"
          $esd = "C:\work\iso\sources\install.esd"
          $src = if (Test-Path $wim) { $wim } else { $esd }
          $idx = $null; $cur = $null
          foreach ($l in (dism /Get-WimInfo /WimFile:$src)) {
            if ($l -match '^Index : (\d+)') { $cur = $matches[1] }
            elseif ($l -match '^Name : (.+)$' -and $matches[1].Trim() -eq $name) { $idx = $cur }
          }
          if (-not $idx) { Write-Warning "Không thấy '$name', dùng Index 1"; $idx = 1 }
          Write-Host "Dùng Index $idx"
          dism /Export-Image /SourceImageFile:$src /SourceIndex:$idx /DestinationImageFile:C:\work\one.wim /Compress:fast
          if ($LASTEXITCODE -ne 0) { throw "Export lỗi" }
          Remove-Item $src -Force
          Move-Item C:\work\one.wim $wim -Force

      - name: Tải Chrome và tạo script sau cài đặt
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $d = 'C:\work\iso\sources\$OEM$\$$\Setup\Scripts'
          New-Item -ItemType Directory -Force $d | Out-Null
          Invoke-WebRequest "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi" -OutFile "$d\chrome.msi"
          @"
          @echo off
          msiexec /i "%~dp0chrome.msi" /qn /norestart
          del /f /q "%~dp0chrome.msi"
          net accounts /maxpwage:unlimited
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-LocalUser -Name '${{ inputs.user }}' -PasswordNeverExpires `$true"
          wmic useraccount where "name='${{ inputs.user }}'" set passwordexpires=false
          reg add HKLM\SYSTEM\Setup\MoSetup /v AllowUpgradesWithUnsupportedTPMOrCPU /t REG_DWORD /d 1 /f
          powercfg -h off
          "@ | Set-Content "$d\SetupComplete.cmd" -Encoding ASCII

      - name: Sửa install.wim
        shell: pwsh
        run: |
          $wim = "C:\work\iso\sources\install.wim"
          $mount = "C:\work\mount"
          dism /Mount-Image /ImageFile:$wim /Index:1 /MountDir:$mount

          # ===== Gỡ hết app, chỉ giữ Store + app lõi hệ thống + framework + codec =====
          $keep = "VCLibs","NET.Native","UI.Xaml","WindowsAppRuntime","WindowsStore","StorePurchaseApp",
            "DesktopAppInstaller","SecHealthUI","WindowsNotepad","Paint","WindowsCalculator","Windows.Photos",
            "ScreenSketch","WindowsTerminal","WindowsCamera","WindowsAlarms","WindowsSoundRecorder",
            "HEIFImageExtension","HEVCVideoExtension","VP9VideoExtensions","WebpImageExtension",
            "WebMediaExtensions","RawImageExtension","AV1VideoExtension"
          $pk = dism /Image:$mount /Get-ProvisionedAppxPackages | Select-String "PackageName" | ForEach-Object { ($_ -split ":\s*")[1].Trim() }
          foreach ($p in $pk) {
            $giu = $false
            foreach ($k in $keep) { if ($p -like "*$k*") { $giu = $true; break } }
            if (-not $giu) { dism /Image:$mount /Remove-ProvisionedAppxPackage /PackageName:$p | Out-Null }
          }

          # ===== Gỡ Microsoft Edge (giữ WebView2) =====
          $edgePaths = @(
            "$mount\Program Files (x86)\Microsoft\Edge",
            "$mount\Program Files (x86)\Microsoft\EdgeCore",
            "$mount\Program Files (x86)\Microsoft\EdgeUpdate",
            "$mount\Program Files (x86)\Microsoft\Temp",
            "$mount\ProgramData\Microsoft\Windows\Start Menu\Programs\Microsoft Edge.lnk",
            "$mount\Users\Default\Desktop\Microsoft Edge.lnk",
            "$mount\Users\Public\Desktop\Microsoft Edge.lnk"
          )
          foreach ($p in $edgePaths) {
            if (Test-Path $p) {
              takeown /f "$p" /r /d y | Out-Null
              icacls "$p" /grant "Administrators:F" /t /c | Out-Null
              Remove-Item "$p" -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-ChildItem "$mount\Windows\System32\Tasks" -Filter "MicrosoftEdge*" -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }
          Get-ChildItem "$mount\Windows\SystemApps" -Filter "Microsoft.MicrosoftEdge*" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object {
              takeown /f $_.FullName /r /d y | Out-Null
              icacls $_.FullName /grant "Administrators:F" /t /c | Out-Null
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }

          # ===== Xoá OneDrive =====
          foreach ($f in "$mount\Windows\System32\OneDriveSetup.exe","$mount\Windows\SysWOW64\OneDriveSetup.exe") {
            if (Test-Path $f) {
              takeown /f $f | Out-Null
              icacls $f /grant "Administrators:F" | Out-Null
              Remove-Item $f -Force -ErrorAction SilentlyContinue
            }
          }

          # ===== Xoá WinRE (tuỳ chọn) =====
          if ("${{ inputs.xoa_winre }}" -eq "true") {
            $re = "$mount\Windows\System32\Recovery\Winre.wim"
            if (Test-Path $re) {
              takeown /f $re | Out-Null
              icacls $re /grant "Administrators:F" | Out-Null
              Remove-Item $re -Force -ErrorAction SilentlyContinue
            }
          }

          # ===== Registry offline (branding + giảm RAM) =====
          reg load HKLM\OFFSYS  "$mount\Windows\System32\config\SYSTEM"
          reg load HKLM\OFFSOFT "$mount\Windows\System32\config\SOFTWARE"
          reg load HKLM\OFFUSER "$mount\Users\Default\NTUSER.DAT"

          # Branding
          reg add "HKLM\OFFSOFT\Microsoft\Windows\CurrentVersion\OEMInformation" /v Manufacturer /t REG_SZ /d "${{ inputs.oem_name }}" /f
          reg add "HKLM\OFFSOFT\Microsoft\Windows\CurrentVersion\OEMInformation" /v Model /t REG_SZ /d "${{ inputs.oem_name }} Edition" /f
          reg add "HKLM\OFFSOFT\Microsoft\Windows\CurrentVersion\Policies\System" /v EnableFirstLogonAnimation /t REG_DWORD /d 0 /f

          # Driver: giữ Windows Update tự cài driver
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\WindowsUpdate" /v ExcludeWUDriversInQualityUpdate /t REG_DWORD /d 0 /f

          # Chặn Edge tự cài lại
          reg add "HKLM\OFFSOFT\Policies\Microsoft\EdgeUpdate" /v InstallDefault /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\EdgeUpdate" /v "Install{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}" /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\EdgeUpdate" /v "Update{56EB18F8-B008-4CBD-B6D2-8C97FE7E9062}" /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFSOFT\Microsoft\EdgeUpdate" /v DoNotUpdateToEdgeWithChromium /t REG_DWORD /d 1 /f

          # Tắt service không cần (Start=4)
          $svc = "DiagTrack","dmwappushservice","SysMain","WSearch","MapsBroker","RetailDemo","Fax",
            "WerSvc","lfsvc","XblAuthManager","XblGameSave","XboxGipSvc","XboxNetApiSvc",
            "wisvc","PhoneSvc","SEMgrSvc","WalletService","icssvc","SharedRealitySvc",
            "diagnosticshub.standardcollector.service"
          if ("${{ inputs.tat_defender }}" -eq "true") {
            $svc += "WinDefend","WdNisSvc","WdNisDrv","WdFilter","WdBoot","Sense"
          }
          foreach ($s in $svc) {
            $k = "HKLM:\OFFSYS\ControlSet001\Services\$s"
            if (Test-Path $k) { Set-ItemProperty $k -Name Start -Value 4 -Type DWord -ErrorAction SilentlyContinue }
          }

          # Policy toàn máy
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\CloudContent" /v DisableWindowsConsumerFeatures /t REG_DWORD /d 1 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\CloudContent" /v DisableSoftLanding /t REG_DWORD /d 1 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\DataCollection" /v AllowTelemetry /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\WindowsCopilot" /v TurnOffWindowsCopilot /t REG_DWORD /d 1 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Dsh" /v AllowNewsAndInterests /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\Windows Feeds" /v EnableFeeds /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\AppPrivacy" /v LetAppsRunInBackground /t REG_DWORD /d 2 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\OneDrive" /v DisableFileSyncNGSC /t REG_DWORD /d 1 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\GameDVR" /v AllowGameDVR /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\Windows Search" /v AllowCortana /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\System" /v EnableActivityFeed /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFSOFT\Policies\Microsoft\Windows\WindowsAI" /v DisableAIDataAnalysis /t REG_DWORD /d 1 /f

          # User mặc định: tắt hiệu ứng, Widgets, Chat, gợi ý, OneDrive tự chạy
          reg add "HKLM\OFFUSER\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" /v VisualFXSetting /t REG_DWORD /d 2 /f
          reg add "HKLM\OFFUSER\Control Panel\Desktop" /v UserPreferencesMask /t REG_BINARY /d 9012038010000000 /f
          reg add "HKLM\OFFUSER\Control Panel\Desktop\WindowMetrics" /v MinAnimate /t REG_SZ /d 0 /f
          reg add "HKLM\OFFUSER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v TaskbarAnimations /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFUSER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v TaskbarDa /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFUSER\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" /v TaskbarMn /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFUSER\Software\Microsoft\Windows\CurrentVersion\Search" /v SearchboxTaskbarMode /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFUSER\Software\Microsoft\Windows\CurrentVersion\BackgroundAccessApplications" /v GlobalUserDisabled /t REG_DWORD /d 1 /f
          reg add "HKLM\OFFUSER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SilentInstalledAppsEnabled /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFUSER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-338388Enabled /t REG_DWORD /d 0 /f
          reg add "HKLM\OFFUSER\Software\Microsoft\Windows\CurrentVersion\ContentDeliveryManager" /v SubscribedContent-338389Enabled /t REG_DWORD /d 0 /f
          reg delete "HKLM\OFFUSER\Software\Microsoft\Windows\CurrentVersion\Run" /v OneDriveSetup /f

          # ===== Logo / ảnh nền (đặt file trong assets/logo.png và assets/wallpaper.jpg) =====
          $assets = "$env:GITHUB_WORKSPACE\assets"
          Add-Type -AssemblyName System.Drawing
          function Take($p) { takeown /f "$p" | Out-Null; icacls "$p" /grant "Administrators:F" | Out-Null }
          function Resize-Img($src, $dst, $w, $h) {
            $img = [System.Drawing.Image]::FromFile($src)
            $bmp = New-Object System.Drawing.Bitmap($w, $h)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = 'HighQualityBicubic'
            $g.DrawImage($img, 0, 0, $w, $h)
            $fmt = switch ([IO.Path]::GetExtension($dst).ToLower()) { '.png' {'Png'} '.bmp' {'Bmp'} default {'Jpeg'} }
            $bmp.Save($dst, [System.Drawing.Imaging.ImageFormat]::$fmt)
            $g.Dispose(); $bmp.Dispose(); $img.Dispose()
          }

          if (Test-Path "$assets\logo.png") {
            # Ảnh user mặc định
            $up = "$mount\ProgramData\Microsoft\User Account Pictures"
            Get-ChildItem $up -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(user|guest)' } | ForEach-Object {
              $sz = 448
              if ($_.Name -match '-(\d+)\.') { $sz = [int]$matches[1] }
              Take $_.FullName
              Resize-Img "$assets\logo.png" $_.FullName $sz $sz
            }
            # Logo OEM trong Settings > About
            Resize-Img "$assets\logo.png" "$mount\Windows\System32\oemlogo.bmp" 120 120
            reg add "HKLM\OFFSOFT\Microsoft\Windows\CurrentVersion\OEMInformation" /v Logo /t REG_SZ /d "C:\Windows\System32\oemlogo.bmp" /f
          }

          if (Test-Path "$assets\wallpaper.jpg") {
            $wp = @("$mount\Windows\Web\Wallpaper\Windows\img0.jpg")
            $wp += Get-ChildItem "$mount\Windows\Web\4K\Wallpaper\Windows" -File -ErrorAction SilentlyContinue | ForEach-Object FullName
            $wp += Get-ChildItem "$mount\Windows\Web\Screen" -File -Filter "img*.jpg" -ErrorAction SilentlyContinue | ForEach-Object FullName
            foreach ($f in $wp) {
              if (Test-Path $f) {
                $im = [System.Drawing.Image]::FromFile($f); $w = $im.Width; $h = $im.Height; $im.Dispose()
                Take $f
                Resize-Img "$assets\wallpaper.jpg" $f $w $h
              }
            }
          }

          [gc]::Collect(); Start-Sleep 3
          reg unload HKLM\OFFSYS
          reg unload HKLM\OFFSOFT
          reg unload HKLM\OFFUSER

          # ===== Dọn WinSxS (giảm dung lượng image) =====
          dism /Image:$mount /Cleanup-Image /StartComponentCleanup /ResetBase

          dism /Unmount-Image /MountDir:$mount /Commit

      - name: Nén install.wim thành ESD (nhỏ nhất)
        shell: pwsh
        run: |
          $wim = "C:\work\iso\sources\install.wim"
          $esd = "C:\work\iso\sources\install.esd"
          dism /Export-Image /SourceImageFile:$wim /SourceIndex:1 /DestinationImageFile:$esd /Compress:recovery
          if ($LASTEXITCODE -ne 0) { throw "Nén ESD lỗi" }
          Remove-Item $wim -Force
          Get-ChildItem C:\work\iso\sources | Where-Object { $_.Name -like "install.*" } | Format-Table Name, Length

      - name: Bỏ kiểm tra phần cứng (TPM, Secure Boot, RAM, CPU, ổ cứng)
        shell: pwsh
        run: |
          Set-Content C:\work\iso\sources\appraiserres.dll -Value $null

      - name: Thêm autounattend.xml
        shell: pwsh
        run: |
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend" xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
           <settings pass="windowsPE">
            <component name="Microsoft-Windows-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
             <DynamicUpdate>
              <Enable>false</Enable>
              <WillShowUI>Never</WillShowUI>
             </DynamicUpdate>
             <RunSynchronous>
              <RunSynchronousCommand wcm:action="add"><Order>1</Order><Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassTPMCheck /t REG_DWORD /d 1 /f</Path></RunSynchronousCommand>
              <RunSynchronousCommand wcm:action="add"><Order>2</Order><Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassSecureBootCheck /t REG_DWORD /d 1 /f</Path></RunSynchronousCommand>
              <RunSynchronousCommand wcm:action="add"><Order>3</Order><Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassRAMCheck /t REG_DWORD /d 1 /f</Path></RunSynchronousCommand>
              <RunSynchronousCommand wcm:action="add"><Order>4</Order><Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassCPUCheck /t REG_DWORD /d 1 /f</Path></RunSynchronousCommand>
              <RunSynchronousCommand wcm:action="add"><Order>5</Order><Path>reg add HKLM\SYSTEM\Setup\LabConfig /v BypassStorageCheck /t REG_DWORD /d 1 /f</Path></RunSynchronousCommand>
             </RunSynchronous>
            </component>
           </settings>
           <settings pass="oobeSystem">
            <component name="Microsoft-Windows-Shell-Setup" processorArchitecture="amd64" publicKeyToken="31bf3856ad364e35" language="neutral" versionScope="nonSxS">
             <OOBE>
              <HideEULAPage>true</HideEULAPage>
              <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
              <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
              <ProtectYourPC>3</ProtectYourPC>
             </OOBE>
             <UserAccounts><LocalAccounts>
              <LocalAccount wcm:action="add">
               <Name>${{ inputs.user }}</Name>
               <Group>Administrators</Group>
               <Password><Value></Value><PlainText>true</PlainText></Password>
              </LocalAccount>
             </LocalAccounts></UserAccounts>
             <AutoLogon>
              <Enabled>true</Enabled>
              <Username>${{ inputs.user }}</Username>
              <LogonCount>1</LogonCount>
             </AutoLogon>
            </component>
           </settings>
          </unattend>
          "@ | Set-Content C:\work\iso\autounattend.xml -Encoding UTF8

      - name: Đổi ảnh nền màn hình cài đặt (boot.wim)
        shell: pwsh
        run: |
          $wp = "$env:GITHUB_WORKSPACE\assets\wallpaper.jpg"
          if (-not (Test-Path $wp)) { Write-Host "Không có wallpaper.jpg, bỏ qua"; exit 0 }
          Add-Type -AssemblyName System.Drawing
          function Resize-Img($src, $dst, $w, $h) {
            $img = [System.Drawing.Image]::FromFile($src)
            $bmp = New-Object System.Drawing.Bitmap($w, $h)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.InterpolationMode = 'HighQualityBicubic'
            $g.DrawImage($img, 0, 0, $w, $h)
            $fmt = switch ([IO.Path]::GetExtension($dst).ToLower()) { '.png' {'Png'} '.bmp' {'Bmp'} default {'Jpeg'} }
            $bmp.Save($dst, [System.Drawing.Imaging.ImageFormat]::$fmt)
            $g.Dispose(); $bmp.Dispose(); $img.Dispose()
          }
          $boot = "C:\work\iso\sources\boot.wim"
          $bm = "C:\work\bootmount"
          New-Item -ItemType Directory -Force $bm | Out-Null
          dism /Mount-Image /ImageFile:$boot /Index:2 /MountDir:$bm
          $n = 0
          Get-ChildItem "$bm\sources" -File -Filter "background*" -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.bmp','.png','.jpg' } | ForEach-Object {
              $im = [System.Drawing.Image]::FromFile($_.FullName); $w = $im.Width; $h = $im.Height; $im.Dispose()
              takeown /f $_.FullName | Out-Null; icacls $_.FullName /grant "Administrators:F" | Out-Null
              Resize-Img $wp $_.FullName $w $h
              Write-Host "Đã thay $($_.Name) ($w x $h)"
              $n++
            }
          Write-Host "Số file nền đã thay: $n"
          dism /Unmount-Image /MountDir:$bm /Commit

      - name: Đóng gói ISO
        shell: pwsh
        run: |
          choco install windows-adk-oscdimg -y --no-progress
          $osc = (Get-ChildItem "C:\Program Files (x86)\Windows Kits" -Recurse -Filter oscdimg.exe | Select-Object -First 1).FullName
          $etfs = "C:\work\iso\boot\etfsboot.com"
          $efi  = "C:\work\iso\efi\microsoft\boot\efisys.bin"
          & $osc -m -o -u2 -udfver102 -bootdata:"2#p0,e,b$etfs#pEF,e,b$efi" C:\work\iso C:\work\MyWindows.iso
          if ($LASTEXITCODE -ne 0) { throw "oscdimg lỗi" }
          "{0:N2} GB" -f ((Get-Item C:\work\MyWindows.iso).Length / 1GB) | Write-Host

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: MyWindows-iso
          path: C:\work\MyWindows.iso
          compression-level: 0
          retention-days: 3
